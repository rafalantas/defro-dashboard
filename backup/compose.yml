name: thermoflow-backup

services:
  backup:
    image: ghcr.io/rafalantas/thermoflow-backup:latest
    pull_policy: always
    container_name: thermoflow-backup
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Warsaw}
      SOURCE_DB: /source/thermoflow.sqlite3
      BACKUP_DIR: /backups
      LOCAL_RETENTION_HOURS: ${LOCAL_RETENTION_HOURS:-48}
      OFFSITE_HOUR: ${OFFSITE_HOUR:-2}
      OFFSITE_MINUTE: ${OFFSITE_MINUTE:-30}
      OFFSITE_RETENTION_DAYS: ${OFFSITE_RETENTION_DAYS:-90}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?Set R2_ACCOUNT_ID in Portainer}
      R2_BUCKET: ${R2_BUCKET:-thermoflow-backups}
      AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?Set R2_ACCESS_KEY_ID in Portainer}
      AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?Set R2_SECRET_ACCESS_KEY in Portainer}
      RESTIC_REPOSITORY: s3:https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com/${R2_BUCKET}/thermoflow
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?Set RESTIC_PASSWORD in Portainer}
    volumes:
      - type: bind
        source: /mnt/thermoflow/db
        target: /source
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/thermoflow/db/backups/automatic
        target: /backups
        bind:
          create_host_path: true
