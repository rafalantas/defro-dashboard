services:
  defro-dashboard:
    image: ghcr.io/rafalantas/defro-dashboard:latest
    container_name: defro-dashboard
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      - EMODUL_TOKEN=${EMODUL_TOKEN}
      - EMODUL_USER_ID=${EMODUL_USER_ID}
      - EMODUL_UDID=${EMODUL_UDID}
      - REFRESH_INTERVAL=${REFRESH_INTERVAL:-30}
      - AUTO_TEMP_THRESHOLD_DEFAULT=${AUTO_TEMP_THRESHOLD:-15}
      - AUTO_TEMP_MODE_DEFAULT=${AUTO_TEMP_MODE:-3}
      - AUTO_TEMP_BELOW_MODE_DEFAULT=${AUTO_TEMP_BELOW_MODE:-0}
    volumes:
      - defro-data:/data

volumes:
  defro-data:
