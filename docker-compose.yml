name: thermoflow

services:
  thermoflow:
    image: ghcr.io/rafalantas/thermoflow-dashboard:latest
    pull_policy: always
    container_name: thermoflow-dashboard
    ports:
      - "5001:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    image: ghcr.io/rafalantas/thermoflow-dashboard-api:latest
    pull_policy: always
    container_name: thermoflow-dashboard-api
    environment:
      TECH_API_TOKEN: ${TECH_API_TOKEN:-}
      FIBARO_HC3_URL: ${FIBARO_HC3_URL:-}
      FIBARO_HC3_USERNAME: ${FIBARO_HC3_USERNAME:-}
      FIBARO_HC3_PASSWORD: ${FIBARO_HC3_PASSWORD:-}
      FIBARO_HC3_CREDENTIALS_FILE: ${FIBARO_HC3_CREDENTIALS_FILE:-}
      FIBARO_HC3_TIMEOUT_SECONDS: ${FIBARO_HC3_TIMEOUT_SECONDS:-12}
      FIBARO_HC3_API_TOKEN: ${FIBARO_HC3_API_TOKEN:-}
      TECH_MODULE_ID: ${TECH_MODULE_ID:-}
      THINGSPEAK_CHANNEL_IDS: ${THINGSPEAK_CHANNEL_IDS:-}
      THINGSPEAK_WRITE_KEYS: ${THINGSPEAK_WRITE_KEYS:-}
      THINGSPEAK_READ_KEYS: ${THINGSPEAK_READ_KEYS:-}
      THINGSPEAK_WRITE_INTERVAL_SECONDS: ${THINGSPEAK_WRITE_INTERVAL_SECONDS:-40}
      THINGSPEAK_FIRE_CHANNEL_ID: ${THINGSPEAK_FIRE_CHANNEL_ID:-}
      THINGSPEAK_FIRE_WRITE_KEY: ${THINGSPEAK_FIRE_WRITE_KEY:-}
      THINGSPEAK_FIRE_READ_KEY: ${THINGSPEAK_FIRE_READ_KEY:-}
      THINGSPEAK_FUEL_CHANNEL_ID: ${THINGSPEAK_FUEL_CHANNEL_ID:-}
      THINGSPEAK_FUEL_WRITE_KEY: ${THINGSPEAK_FUEL_WRITE_KEY:-}
      THINGSPEAK_FUEL_READ_KEY: ${THINGSPEAK_FUEL_READ_KEY:-}
      FUEL_API_TOKEN: ${FUEL_API_TOKEN:-}
      FUEL_LAT: ${FUEL_LAT:-}
      FUEL_LON: ${FUEL_LON:-}
      FUEL_COUNTER_EPOCH: ${FUEL_COUNTER_EPOCH:-}
      PELLET_BAG_KG: ${PELLET_BAG_KG:-15}
      PELLET_HOPPER_KG: ${PELLET_HOPPER_KG:-}
      PELLET_HOPPER_RESERVE_PERCENT: ${PELLET_HOPPER_RESERVE_PERCENT:-}
      HDD_BASE: ${HDD_BASE:-}
      FUEL_HDD_BASE_FIXED: ${FUEL_HDD_BASE_FIXED:-}
      PELLET_KWH_PER_KG: ${PELLET_KWH_PER_KG:-4.8}
      BOILER_EFF: ${BOILER_EFF:-0.88}
      FUEL_TZ: ${FUEL_TZ:-Europe/Warsaw}
      FUEL_TEMPS_DATA_START: ${FUEL_TEMPS_DATA_START:-}
      THINGSPEAK_WRITE_ENABLED: ${THINGSPEAK_WRITE_ENABLED:-true}
      THERMOFLOW_DB_PATH: /var/lib/thermoflow/thermoflow.sqlite3
      THERMOFLOW_ANALYTICS_ENABLED: ${THERMOFLOW_ANALYTICS_ENABLED:-true}
      THERMOFLOW_ANALYTICS_INTERVAL_SECONDS: ${THERMOFLOW_ANALYTICS_INTERVAL_SECONDS:-21600}
      THERMOFLOW_ANALYTICS_INITIAL_DELAY_SECONDS: ${THERMOFLOW_ANALYTICS_INITIAL_DELAY_SECONDS:-120}
      # auto = telemetry range reads from the local SQLite mirror (ThingSpeak as fallback);
      # thingspeak = always read from ThingSpeak (instant rollback, no redeploy of the image).
      THERMOFLOW_READ_SOURCE: ${THERMOFLOW_READ_SOURCE:-auto}
      THERMOFLOW_LOCAL_FEEDS_START: ${THERMOFLOW_LOCAL_FEEDS_START:-}
      THERMOFLOW_BURNER_MODEL_PATH: ${THERMOFLOW_BURNER_MODEL_PATH:-/run/thermoflow/burner-model.json}
      THERMOFLOW_FUEL_MODEL_PATH: ${THERMOFLOW_FUEL_MODEL_PATH:-/run/thermoflow/fuel-model.json}
      THERMOFLOW_FIRE_SNAPSHOT_PATH: ${THERMOFLOW_FIRE_SNAPSHOT_PATH:-}
      THERMOFLOW_FUEL_SNAPSHOT_PATH: ${THERMOFLOW_FUEL_SNAPSHOT_PATH:-}
      THERMOFLOW_VERIFIED_REFILL_IDS_PATH: ${THERMOFLOW_VERIFIED_REFILL_IDS_PATH:-}
      THERMOFLOW_BURNER_LEDGER_PATH: ${THERMOFLOW_BURNER_LEDGER_PATH:-}
      THERMOFLOW_FUEL_LEDGER_PATH: ${THERMOFLOW_FUEL_LEDGER_PATH:-}
    volumes:
      - ./data/thermoflow:/run/thermoflow:ro
      # SSD image is mounted by the host at /mnt/thermoflow.
      # Refuse to create a fallback directory on the microSD if the mount is missing.
      - type: bind
        source: /mnt/thermoflow/db
        target: /var/lib/thermoflow
        bind:
          create_host_path: false
    expose:
      - "8000"
    restart: unless-stopped

  fibaro-collector:
    image: ghcr.io/rafalantas/thermoflow-dashboard-api:latest
    pull_policy: always
    container_name: thermoflow-fibaro-collector
    depends_on:
      - api
    environment:
      FIBARO_HC3_URL: ${FIBARO_HC3_URL:-}
      FIBARO_HC3_USERNAME: ${FIBARO_HC3_USERNAME:-}
      FIBARO_HC3_PASSWORD: ${FIBARO_HC3_PASSWORD:-}
      FIBARO_HC3_CREDENTIALS_FILE: ${FIBARO_HC3_CREDENTIALS_FILE:-}
      FIBARO_HC3_TIMEOUT_SECONDS: ${FIBARO_HC3_TIMEOUT_SECONDS:-12}
      FIBARO_HC3_INITIAL_START: ${FIBARO_HC3_INITIAL_START:-}
      THERMOFLOW_DB_PATH: /var/lib/thermoflow/thermoflow.sqlite3
    volumes:
      # Same SSD-backed database directory as the API.
      - type: bind
        source: /mnt/thermoflow/db
        target: /var/lib/thermoflow
        bind:
          create_host_path: false
      # Optional HC3 credentials JSON can be placed in this host directory
      # and referenced as /run/thermoflow/fibaro-credentials.json.
      - ./data/thermoflow:/run/thermoflow:ro
    command:
      - python
      - -m
      - thermoflow_fibaro_scheduler
      - /var/lib/thermoflow/thermoflow.sqlite3
      - --history-days
      - "14"
      - --interval-seconds
      - "300"
    restart: unless-stopped


  thingspeak-collector:
    image: ghcr.io/rafalantas/thermoflow-dashboard-api:latest
    pull_policy: always
    container_name: thermoflow-thingspeak-collector
    depends_on:
      - api
    environment:
      THINGSPEAK_CHANNEL_IDS: ${THINGSPEAK_CHANNEL_IDS:-}
      THINGSPEAK_READ_KEYS: ${THINGSPEAK_READ_KEYS:-}
      THINGSPEAK_FIRE_CHANNEL_ID: ${THINGSPEAK_FIRE_CHANNEL_ID:-}
      THINGSPEAK_FIRE_READ_KEY: ${THINGSPEAK_FIRE_READ_KEY:-}
      THINGSPEAK_FUEL_CHANNEL_ID: ${THINGSPEAK_FUEL_CHANNEL_ID:-}
      THINGSPEAK_FUEL_READ_KEY: ${THINGSPEAK_FUEL_READ_KEY:-}
      THERMOFLOW_DB_PATH: /var/lib/thermoflow/thermoflow.sqlite3
      THERMOFLOW_THINGSPEAK_HISTORY_DAYS: ${THERMOFLOW_THINGSPEAK_HISTORY_DAYS:-14}
      THERMOFLOW_THINGSPEAK_INITIAL_START: ${THERMOFLOW_THINGSPEAK_INITIAL_START:-}
      THERMOFLOW_THINGSPEAK_INTERVAL_SECONDS: ${THERMOFLOW_THINGSPEAK_INTERVAL_SECONDS:-300}
      THERMOFLOW_THINGSPEAK_REQUEST_INTERVAL_SECONDS: ${THERMOFLOW_THINGSPEAK_REQUEST_INTERVAL_SECONDS:-15}
    volumes:
      - type: bind
        source: /mnt/thermoflow/db
        target: /var/lib/thermoflow
        bind:
          create_host_path: false
    command:
      - python
      - -u
      - -m
      - thermoflow_thingspeak_scheduler
      - /var/lib/thermoflow/thermoflow.sqlite3
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: thermoflow-cloudflared
    profiles:
      - cloudflare
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - thermoflow
    restart: unless-stopped
