services:
  thermoflow:
    image: ghcr.io/rafalantas/defro-dashboard:latest
    pull_policy: always
    container_name: defro-dashboard
    ports:
      - "5001:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    image: ghcr.io/rafalantas/defro-dashboard-api:latest
    pull_policy: always
    container_name: defro-dashboard-api
    environment:
      TECH_API_TOKEN: ${TECH_API_TOKEN:-}
      TECH_MODULE_ID: ${TECH_MODULE_ID:-}
      THINGSPEAK_CHANNEL_IDS: ${THINGSPEAK_CHANNEL_IDS:-}
      THINGSPEAK_WRITE_KEYS: ${THINGSPEAK_WRITE_KEYS:-}
      THINGSPEAK_READ_KEYS: ${THINGSPEAK_READ_KEYS:-}
      THINGSPEAK_WRITE_INTERVAL_SECONDS: ${THINGSPEAK_WRITE_INTERVAL_SECONDS:-40}
      THINGSPEAK_FUEL_CHANNEL_ID: ${THINGSPEAK_FUEL_CHANNEL_ID:-}
      THINGSPEAK_FUEL_WRITE_KEY: ${THINGSPEAK_FUEL_WRITE_KEY:-}
      THINGSPEAK_FUEL_READ_KEY: ${THINGSPEAK_FUEL_READ_KEY:-}
      FUEL_API_TOKEN: ${FUEL_API_TOKEN:-}
      FUEL_LAT: ${FUEL_LAT:-}
      FUEL_LON: ${FUEL_LON:-}
      PELLET_BAG_KG: ${PELLET_BAG_KG:-15}
      PELLET_HOPPER_KG: ${PELLET_HOPPER_KG:-}
      PELLET_HOPPER_RESERVE_PERCENT: ${PELLET_HOPPER_RESERVE_PERCENT:-}
      HDD_BASE: ${HDD_BASE:-}
      PELLET_KWH_PER_KG: ${PELLET_KWH_PER_KG:-4.8}
      BOILER_EFF: ${BOILER_EFF:-0.88}
      FUEL_TZ: ${FUEL_TZ:-Europe/Warsaw}
      FUEL_TEMPS_DATA_START: ${FUEL_TEMPS_DATA_START:-}
      THINGSPEAK_WRITE_ENABLED: ${THINGSPEAK_WRITE_ENABLED:-true}
    expose:
      - "8000"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: defro-dashboard-cloudflared
    profiles:
      - cloudflare
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - thermoflow
    restart: unless-stopped
