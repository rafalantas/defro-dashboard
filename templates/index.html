<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Defro ST-9730</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f2f0ec; --surface: #ffffff; --border: #e4e2de;
    --text: #1a1a18; --text-sub: #6b6960; --text-muted: #a09e97;
    --accent: #d85a2a; --accent-bg: #fdf0eb;
    --green: #2d9c5a; --green-bg: #e8f7ef;
    --amber: #b87a14; --amber-bg: #fef5e4;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem; }
  .dashboard { max-width: 860px; margin: 0 auto; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo { width: 48px; height: 48px; background: var(--accent); border-radius: 12px; display: flex; align-items: center; justify-content: center; }
  .logo svg { width: 26px; height: 26px; }
  .device-name { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
  .device-sub { font-size: 13px; color: var(--text-sub); margin-top: 2px; }
  .status-badge { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; padding: 6px 14px; border-radius: 20px; background: var(--green-bg); color: var(--green); cursor: pointer; border: none; font-family: inherit; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
  .status-dot.loading { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .temps-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 10px; }
  .temp-card { background: var(--surface); border-radius: 14px; padding: 1.1rem; border: 1px solid var(--border); }
  .temp-label { font-size: 12px; color: var(--text-sub); margin-bottom: 8px; }
  .temp-value { font-size: 28px; font-weight: 600; letter-spacing: -0.5px; line-height: 1; }
  .temp-unit { font-size: 14px; font-weight: 400; color: var(--text-sub); }
  .mode-card { background: var(--surface); border-radius: 14px; padding: 1rem 1.25rem; border: 1px solid var(--border); display: flex; align-items: center; gap: 1rem; margin-bottom: 10px; flex-wrap: wrap; }
  .mode-icon { width: 42px; height: 42px; border-radius: 10px; background: var(--amber-bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .mode-icon svg { width: 22px; height: 22px; }
  .mode-name { font-size: 15px; font-weight: 600; }
  .mode-label { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
  .mode-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .mode-btn { font-size: 12px; font-weight: 500; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text-sub); cursor: pointer; font-family: inherit; transition: all .15s; }
  .mode-btn:hover { background: var(--bg); color: var(--text); }
  .mode-btn.active { background: var(--accent-bg); color: var(--accent); border-color: #f0c4ae; font-weight: 600; }
  .mode-btn:disabled { opacity: .5; cursor: not-allowed; }
  .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .pellet-card, .valve-card { background: var(--surface); border-radius: 14px; padding: 1.1rem 1.25rem; border: 1px solid var(--border); }
  .section-label { font-size: 12px; color: var(--text-sub); margin-bottom: 10px; }
  .pellet-bar-bg { height: 5px; background: var(--bg); border-radius: 3px; overflow: hidden; margin: 8px 0; }
  .pellet-bar-fill { height: 5px; background: var(--accent); border-radius: 3px; transition: width .6s ease; }
  .pellet-row { display: flex; justify-content: space-between; align-items: baseline; }
  .pellet-pct { font-size: 26px; font-weight: 600; letter-spacing: -0.5px; }
  .pellet-pct span { font-size: 14px; font-weight: 400; color: var(--text-sub); }
  .pellet-hours { font-size: 12px; color: var(--text-muted); }
  .valve-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; border-bottom: 1px solid var(--border); }
  .valve-row:last-child { border-bottom: none; }
  .valve-key { color: var(--text-sub); }
  .valve-val { font-weight: 500; }
  .status-row { background: var(--surface); border-radius: 14px; padding: .875rem 1.25rem; border: 1px solid var(--border); display: flex; gap: 2rem; flex-wrap: wrap; }
  .status-item { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-sub); }
  .status-dot-sm { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; }
  .updated { text-align: right; font-size: 11px; color: var(--text-muted); margin-top: .75rem; }
  .toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--text); color: #fff; font-size: 13px; padding: 10px 16px; border-radius: 10px; opacity: 0; transform: translateY(8px); transition: all .2s; pointer-events: none; z-index: 100; }
  .toast.show { opacity: 1; transform: translateY(0); }
  @media (max-width: 600px) {
    body { padding: 1rem; }
    .temps-grid { grid-template-columns: repeat(2,1fr); }
    .bottom-grid { grid-template-columns: 1fr; }
    .mode-btns { margin-left: 0; }
  }
</style>
</head>
<body>
<div class="dashboard">
  <div class="header">
    <div class="header-left">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2c0 6-6 8-6 14a6 6 0 0 0 12 0c0-6-6-8-6-14z"/>
          <path d="M12 12c0 3-2 4-2 6a2 2 0 0 0 4 0c0-2-2-3-2-6z" fill="#fff" stroke="none"/>
        </svg>
      </div>
      <div>
        <div class="device-name">Defro ST-9730</div>
        <div class="device-sub" id="device-sub">Gamma 40 kW · ładowanie...</div>
      </div>
    </div>
    <button class="status-badge" onclick="loadData()" id="status-badge">
      <span class="status-dot loading" id="status-dot"></span>
      <span id="status-text">Ładowanie</span>
    </button>
  </div>

  <div class="temps-grid">
    <div class="temp-card"><div class="temp-label">CO</div><div class="temp-value" id="t-co">—<span class="temp-unit">°C</span></div></div>
    <div class="temp-card"><div class="temp-label">C.W.U.</div><div class="temp-value" id="t-cwu">—<span class="temp-unit">°C</span></div></div>
    <div class="temp-card"><div class="temp-label">Spaliny</div><div class="temp-value" id="t-spaliny">—<span class="temp-unit">°C</span></div></div>
    <div class="temp-card"><div class="temp-label">Zewnętrzna</div><div class="temp-value" id="t-zewn">—<span class="temp-unit">°C</span></div></div>
  </div>

  <div class="mode-card">
    <div class="mode-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#b87a14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    </div>
    <div>
      <div class="mode-name" id="mode-name">—</div>
      <div class="mode-label">Tryb pracy</div>
    </div>
    <div class="mode-btns">
      <button class="mode-btn" onclick="setMode(0)" id="btn-0">Ogrzewanie</button>
      <button class="mode-btn" onclick="setMode(1)" id="btn-1">Priorytet kotła</button>
      <button class="mode-btn" onclick="setMode(2)" id="btn-2">Pompy równol.</button>
      <button class="mode-btn" onclick="setMode(3)" id="btn-3">Tryb letni</button>
    </div>
  </div>

  <div class="bottom-grid">
    <div class="pellet-card">
      <div class="section-label">Poziom pelletu</div>
      <div class="pellet-bar-bg"><div class="pellet-bar-fill" id="pellet-bar" style="width:0%"></div></div>
      <div class="pellet-row">
        <div class="pellet-pct" id="pellet-pct">—<span>%</span></div>
        <div class="pellet-hours" id="pellet-hours"></div>
      </div>
    </div>
    <div class="valve-card">
      <div class="section-label">Zawór mieszający</div>
      <div class="valve-row"><span class="valve-key">Aktualna</span><span class="valve-val" id="v-akt">—</span></div>
      <div class="valve-row"><span class="valve-key">Powrotna</span><span class="valve-val" id="v-pow">—</span></div>
      <div class="valve-row"><span class="valve-key">Zadana</span><span class="valve-val" id="v-zad">—</span></div>
    </div>
  </div>

  <div class="status-row">
    <div class="status-item"><span class="status-dot-sm"></span><span id="lbl-czuwanie">Czuwanie</span></div>
    <div class="status-item"><span class="status-dot-sm"></span><span id="lbl-wentylator">Wentylator: —</span></div>
    <div class="status-item"><span class="status-dot-sm"></span><span id="lbl-ogien">Czujnik ognia: —</span></div>
  </div>

  <div class="updated" id="updated">—</div>
</div>
<div class="toast" id="toast"></div>

<script>
const MODES = ['Ogrzewanie domu', 'Priorytet kotła', 'Pompy równoległe', 'Tryb letni'];
const STATUS_TO_MODE = { 814: 0, 815: 1, 816: 2, 811: 3 };

function temp(raw) { return (raw / 10).toFixed(1); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function setStatus(state) {
  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');
  const badge = document.getElementById('status-badge');
  if (state === 'loading') {
    dot.className = 'status-dot loading';
    dot.style.background = '#a09e97';
    txt.textContent = 'Ładowanie';
  } else if (state === 'ok') {
    dot.className = 'status-dot';
    dot.style.background = 'var(--green)';
    txt.textContent = 'Online';
    badge.style.cssText = 'background:var(--green-bg);color:var(--green)';
  } else {
    dot.className = 'status-dot';
    dot.style.background = '#e24b4a';
    txt.textContent = 'Offline';
    badge.style.cssText = 'background:#fcebeb;color:#a32d2d';
  }
}

function updateModeButtons(active) {
  for (let i = 0; i < 4; i++) document.getElementById(`btn-${i}`).classList.toggle('active', i === active);
  document.getElementById('mode-name').textContent = MODES[active] ?? '—';
}

async function loadData() {
  setStatus('loading');
  try {
    const res = await fetch('/api/data');
    const json = await res.json();
    if (json.error) throw new Error(json.error);
    const tiles = json.data.tiles || [];
    const byId = Object.fromEntries(tiles.map(t => [t.id, t]));

    const set = (id, elId, fn) => { if (byId[id]) document.getElementById(elId).innerHTML = fn(byId[id]); };

    set(1006, 't-co', t => `${temp(t.params.value)}<span class="temp-unit">°C</span>`);
    set(1007, 't-cwu', t => `${temp(t.params.value)}<span class="temp-unit">°C</span>`);
    set(1008, 't-spaliny', t => `${temp(t.params.value)}<span class="temp-unit">°C</span>`);
    set(1009, 't-zewn', t => `${temp(t.params.value)}<span class="temp-unit">°C</span>`);

    if (byId[1010]) {
      const p = byId[1010].params;
      document.getElementById('pellet-pct').innerHTML = `${p.percentage}<span>%</span>`;
      document.getElementById('pellet-bar').style.width = `${p.percentage}%`;
      document.getElementById('pellet-hours').textContent = p.hours < 0 ? `${Math.abs(p.hours)} h do zera` : `${p.hours} h`;
    }
    if (byId[1012]) {
      const v = byId[1012].params;
      document.getElementById('v-akt').textContent = `${temp(v.currentTemp)}°C`;
      document.getElementById('v-pow').textContent = `${temp(v.returnTemp)}°C`;
      document.getElementById('v-zad').textContent = `${v.setTemp}°C`;
    }
    if (byId[1001]) updateModeButtons(STATUS_TO_MODE[byId[1001].params.statusId] ?? -1);
    if (byId[1011]) document.getElementById('lbl-wentylator').textContent = byId[1011].params.workingStatus ? `Wentylator: bieg ${byId[1011].params.gear}` : 'Wentylator: wyłączony';
    if (byId[1016]) document.getElementById('lbl-ogien').textContent = byId[1016].params.workingStatus ? 'Czujnik ognia: aktywny' : 'Czujnik ognia: brak';
    if (byId[2040]) document.getElementById('lbl-czuwanie').textContent = byId[2040].params.statusId === 233 ? 'Czuwanie' : 'Aktywny';
    if (byId[2000]) document.getElementById('device-sub').textContent = `Gamma 40 kW · ${byId[2000].params.controllerName}`;

    const ts = json.data.tilesLastUpdate?.replace(/\.\d+[+-]\d+:\d+$/, '') ?? '';
    document.getElementById('updated').textContent = `ostatnia aktualizacja: ${ts} · cache: ${json.age}s`;
    setStatus('ok');
  } catch(e) {
    setStatus('error');
    showToast('Błąd połączenia');
  }
}

async function setMode(value) {
  document.querySelectorAll('.mode-btn').forEach(b => b.disabled = true);
  try {
    const res = await fetch('/api/mode', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({value}) });
    const json = await res.json();
    if (json.error) throw new Error(json.error);
    updateModeButtons(value);
    showToast(`Zmieniono: ${MODES[value]}`);
    setTimeout(loadData, 2000);
  } catch(e) {
    showToast('Błąd zmiany trybu');
  } finally {
    document.querySelectorAll('.mode-btn').forEach(b => b.disabled = false);
  }
}

loadData();
setInterval(loadData, 30000);
</script>
</body>
</html>
