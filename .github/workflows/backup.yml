name: Build and test ThermoFLOW backup

on:
  push:
    branches: [main]
    paths:
      - "backup/**"
      - ".github/workflows/backup.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run backup unit tests
        run: python -m unittest discover -s backup/tests -v

  build-image:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (PR) or build and push (main)
        uses: docker/build-push-action@v6
        with:
          context: backup
          file: backup/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/rafalantas/thermoflow-backup:latest
