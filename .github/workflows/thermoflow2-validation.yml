name: ThermoFlow validation

on:
  pull_request:
    branches: [main, "feat/thermoflow-*"]
  push:
    branches:
      - "work/thermoflow2/**"
      - "chore/thermoflow2-**"
  workflow_dispatch:

concurrency:
  group: thermoflow2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax
        run: python -m py_compile api.py fuel.py thermoflow2_runtime.py fuel_engine.py fuel_ai.py fuel_telemetry.py fuel_schema.py fuel_models.py fuel_refills.py fuel_counter.py fuel_energy.py fuel_planning.py fuel_errors.py fuel_http.py fuel_telemetry_provider.py fuel_weather_provider.py fuel_refill_provider.py fuel_thingspeak_daily_provider.py fuel_daily_provider.py fuel_counter_provider.py fuel_estimates.py fuel_period_analysis.py fuel_daily_model.py fuel_summary_metrics.py fuel_summary_estimates.py fuel_house_model.py fuel_runtime.py fuel_config.py fuel_stats_service.py fuel_daily_service.py fuel_summary_service.py fuel_refill_service.py fuel_summary_runtime.py fuel_prefetch_service.py fuel_climate_provider.py fuel_telemetry_audit_service.py fuel_diagnostic_summary.py fuel_hydraulic_correlation.py fuel_cycle_hydraulic_response.py fuel_telemetry_diagnostics.py thermoflow_diagnostic_intelligence.py thermoflow_shadow_anomaly.py thermoflow_causal_diagnostics.py thermoflow_anomaly_v3.py thermoflow_replay.py thermoflow_ml_dataset.py thermoflow_ml_training.py thermoflow_ml_burner_adapter.py thermoflow_digital_twin.py thermoflow_acceptance_evidence.py thermoflow_data_quality_gates.py thermoflow_model_monitoring.py thermoflow_shadow_evaluation.py thermoflow_production_acceptance.py
      - name: Full isolated regression suite
        run: python tools/run_regression_suite.py
      - name: API module import smoke test
        run: python -c "import api; import fuel_engine; import fuel; import fuel_ai; import fuel_telemetry; import fuel_schema; import fuel_models; import fuel_refills; import fuel_counter; import fuel_energy; import fuel_planning; import fuel_errors; import fuel_http; import fuel_telemetry_provider; import fuel_weather_provider; import fuel_refill_provider; import fuel_thingspeak_daily_provider; import fuel_daily_provider; import fuel_counter_provider; import fuel_estimates; import fuel_period_analysis; import fuel_daily_model; import fuel_summary_metrics; import fuel_summary_estimates; import fuel_house_model; import fuel_runtime; import fuel_config; import fuel_stats_service; import fuel_daily_service; import fuel_summary_service; import fuel_refill_service; import fuel_summary_runtime; import fuel_prefetch_service; import fuel_climate_provider; import fuel_telemetry_audit_service; import fuel_diagnostic_summary; import fuel_hydraulic_correlation; import fuel_cycle_hydraulic_response; import fuel_telemetry_diagnostics; import thermoflow_diagnostic_intelligence; import thermoflow_shadow_anomaly; import thermoflow_causal_diagnostics; import thermoflow_anomaly_v3; import thermoflow_replay; import thermoflow_ml_dataset; import thermoflow_ml_training; import thermoflow_ml_burner_adapter; import thermoflow_digital_twin; import thermoflow_acceptance_evidence; import thermoflow_production_acceptance"

  frontend-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: for file in assets/js/*.js; do node --check "$file"; done
      - name: HTML and asset regression
        run: python tests/test_frontend_assets.py
      - name: Overview regression
        run: python tests/test_overview.py

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build frontend image (no push)
        run: |
          docker buildx build --platform ${{ matrix.platform }} --output=type=oci,dest=/tmp/frontend.tar -f Dockerfile .
      - name: Build API image (no push)
        run: |
          docker buildx build --platform ${{ matrix.platform }} --output=type=oci,dest=/tmp/api.tar -f Dockerfile.api .

  api-image-runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build API image for runtime smoke test
        run: docker build --pull -t thermoflow-api-smoke -f Dockerfile.api .
      - name: Verify read-only FIRE snapshot command is packaged
        run: docker run --rm --entrypoint python thermoflow-api-smoke -m thermoflow_fire_snapshot --help
      - name: Verify read-only fuel snapshot command is packaged
        run: docker run --rm --entrypoint python thermoflow-api-smoke -m thermoflow_fuel_snapshot --help
      - name: Verify offline intelligence bundle command is packaged
        run: docker run --rm --entrypoint python thermoflow-api-smoke -m thermoflow_intelligence_bundle --help
      - name: Start API container without external credentials
        run: |
          docker run -d --name thermoflow-api-smoke \
            -p 127.0.0.1:18000:8000 \
            -e THINGSPEAK_WRITE_ENABLED=false \
            thermoflow-api-smoke
      - name: Verify API health from the running image
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/api/health > /tmp/thermoflow-health.json; then
              cat /tmp/thermoflow-health.json
              exit 0
            fi
            sleep 2
          done
          docker logs thermoflow-api-smoke
          exit 1
      - name: Verify fuel engine is available inside the image
        run: |
          status=$(curl --silent --output /tmp/thermoflow-fuel.json --write-out '%{http_code}' http://127.0.0.1:18000/api/fuel/summary)
          cat /tmp/thermoflow-fuel.json
          test "$status" = "200"
      - name: Verify unified API fails closed without credentials or a benchmark bundle
        run: |
          curl --fail --silent http://127.0.0.1:18000/api/thermoflow/v1/intelligence | python -c '
          import json, sys
          result = json.load(sys.stdin)
          assert result["schema"] == "thermoflow-unified-intelligence/1"
          assert len(result["modules"]) == 7
          assert result["live_predictions_enabled"] is False
          for name in ("burner_ml", "fuel_ml", "weather_impact"):
              assert result["modules"][name]["prediction"] is None
              assert result["modules"][name]["status"] == "collecting"
          '
      - name: Verify acceptance endpoint and digital twin fail closed without evidence
        run: |
          curl --fail --silent http://127.0.0.1:18000/api/thermoflow/v1/acceptance | python -c '
          import json, sys
          result = json.load(sys.stdin)
          assert result["schema"] == "thermoflow-production-acceptance/2"
          assert result["status"] in ("blocked", "incomplete")
          assert result["automatic_signoff"] is False
          assert result["digital_twin"]["status"] == "not_assessed"
          gates = {gate["name"]: gate["status"] for gate in result["gates"]}
          assert gates["Data quality"] == "not_assessed"
          assert gates["Model monitoring"] == "not_assessed"
          assert result["safety"]["return_protection_c"] == "55°C ±1°C"
          '
      - name: Stop API container
        if: always()
        run: docker rm -f thermoflow-api-smoke || true
