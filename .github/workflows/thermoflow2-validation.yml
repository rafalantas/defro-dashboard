name: ThermoFlow validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "work/thermoflow2/**"
      - "chore/thermoflow2-**"
  workflow_dispatch:

concurrency:
  group: thermoflow2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax
        run: python -m py_compile api.py fuel.py fuel_engine.py fuel_ai.py fuel_telemetry.py fuel_schema.py fuel_models.py fuel_refills.py fuel_counter.py fuel_energy.py fuel_planning.py fuel_errors.py fuel_http.py fuel_telemetry_provider.py fuel_weather_provider.py fuel_refill_provider.py fuel_thingspeak_daily_provider.py fuel_daily_provider.py fuel_counter_provider.py fuel_estimates.py fuel_period_analysis.py fuel_daily_model.py fuel_summary_metrics.py fuel_summary_estimates.py fuel_house_model.py fuel_runtime.py fuel_config.py
      - name: Fuel Intelligence regression
        run: python -m unittest tests/test_fuel_ai.py tests/test_fuel_planning.py tests/test_fuel_calibration_windows.py
      - name: Fuel HTTP transport regression
        run: python -m unittest tests/test_fuel_http.py
      - name: Fuel estimate contract regression
        run: python -m unittest tests/test_fuel_estimates.py tests/test_fuel_estimate_selection.py tests/test_fuel_engine_interface.py tests/test_fuel_period_analysis.py tests/test_fuel_weather_provider.py tests/test_fuel_refill_provider.py tests/test_fuel_thingspeak_daily_provider.py tests/test_fuel_daily_provider.py tests/test_fuel_counter_provider.py
      - name: Fuel refill regression
        run: python -m unittest tests/test_fuel_refills.py
      - name: Fuel pure model regression
        run: python -m unittest tests/test_fuel_models.py tests/test_fuel_daily_model.py tests/test_fuel_summary_metrics.py tests/test_fuel_summary_estimates.py tests/test_fuel_house_model.py tests/test_fuel_runtime.py
      - name: Fuel telemetry provider and analysis regression
        run: python -m unittest tests/test_fuel_telemetry.py tests/test_fuel_telemetry_resilience.py tests/test_fuel_telemetry_provider.py
      - name: Canonical schema and API isolation regression
        run: python -m unittest tests/test_fuel_schema.py
      - name: Fuel energy module regression
        run: python -m unittest tests/test_fuel_energy.py
      - name: Fuel counter module regression
        run: python -m unittest tests/test_fuel_counter.py
      - name: Counter epoch regression
        run: python tests/test_counter_epoch.py
      - name: HDD base regression
        run: python tests/test_hdd_base.py
      - name: API module import smoke test
        run: python -c "import api; import fuel_engine; import fuel; import fuel_ai; import fuel_telemetry; import fuel_schema; import fuel_models; import fuel_refills; import fuel_counter; import fuel_energy; import fuel_planning; import fuel_errors; import fuel_http; import fuel_telemetry_provider; import fuel_weather_provider; import fuel_refill_provider; import fuel_thingspeak_daily_provider; import fuel_daily_provider; import fuel_counter_provider; import fuel_estimates; import fuel_period_analysis; import fuel_daily_model; import fuel_summary_metrics; import fuel_summary_estimates; import fuel_house_model; import fuel_runtime; import fuel_config"
      - name: Existing fuel model regression
        run: python tests/test_daily_lag.py
      - name: History analysis regression
        run: python tests/test_history_analysis.py

  frontend-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: for file in assets/js/*.js; do node --check "$file"; done
      - name: HTML and asset regression
        run: python tests/test_frontend_assets.py
      - name: Overview regression
        run: python tests/test_overview.py

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build frontend image (no push)
        run: |
          docker buildx build --platform ${{ matrix.platform }} --output=type=oci,dest=/tmp/frontend.tar -f Dockerfile .
      - name: Build API image (no push)
        run: |
          docker buildx build --platform ${{ matrix.platform }} --output=type=oci,dest=/tmp/api.tar -f Dockerfile.api .
