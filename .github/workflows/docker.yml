name: Build and publish dashboard images

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "backup/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backup-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run backup unit tests
        run: python -m unittest discover -s backup/tests -v

  build-and-push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/rafalantas/thermoflow-dashboard
            dockerfile: Dockerfile
          - image: ghcr.io/rafalantas/thermoflow-dashboard-api
            dockerfile: Dockerfile.api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - name: Build and push dashboard image
        if: matrix.dockerfile == 'Dockerfile'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: APP_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Build and push API image
        if: matrix.dockerfile == 'Dockerfile.api'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  redeploy-portainer:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Trigger Portainer stack webhook (optional)
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -n "$PORTAINER_WEBHOOK_URL" ]; then
            curl --fail --silent --show-error --request POST "$PORTAINER_WEBHOOK_URL"
            echo "Portainer redeploy requested."
          else
            echo "PORTAINER_WEBHOOK_URL is not set; images were published and can be deployed from Portainer."
          fi
